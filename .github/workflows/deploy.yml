name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore: ['studio/**', '*.md']
  repository_dispatch:
    types: [sanity-publish]   # بيتبعت من webhook في Sanity أول ما حد يعمل Publish
  schedule:
    - cron: '0 1 * * *'       # إعادة بناء يومية احتياطي (4 الفجر بتوقيت القاهرة)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build
        run: npm run build && node scripts/rebase.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://ahmedsamyelmoghazy.com' }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
